syntax = "proto3";
option csharp_namespace = "DBI.Hell.HeavenInterop";

import "google/protobuf/empty.proto";

service Plugins {
  rpc GetPlugins (google.protobuf.Empty) returns (GetPluginsResponse);
}

message GetPluginsResponse {
  repeated Plugin plugins = 1;
}

message Plugin {
  PluginInfo info = 1;
  PluginConfiguration configuration = 2;
}

message PluginInfo {
  string name = 1;
  string displayName = 2;
  string version = 3;
}

message PluginConfiguration {
  repeated PluginConfigurationCategory categories = 1;
}

message PluginConfigurationCategory {
  string name = 1;
  repeated PluginConfigurationEntry entries = 2;
}

message PluginConfigurationEntry {
  string name = 1;
  string description = 2;
  
  oneof OneOfPluginConfigurationEntry {
      PluginConfigurationBoolEntry boolEntry = 3;
      PluginConfigurationStringEntry stringEntry = 4;
  }
}

message PluginConfigurationBoolEntry {
  bool defaultValue = 3;
}

message PluginConfigurationStringEntry {
  string defaultValue = 3;
  repeated string possibleValues = 4;
}